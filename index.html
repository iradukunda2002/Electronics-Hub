<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroHub - Electronic Components & Services Catalog</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            900: '#134e4a',
                        },
                        cyanAccent: '#06b6d4',
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & JetBrains Mono for Code/Specs -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="h-full text-slate-200 bg-slate-950 flex flex-col min-h-screen">

    <!-- Header Navigation -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-30 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Brand / Logo -->
                <div class="flex items-center space-x-3 cursor-pointer" onclick="resetAllFilters()">
                    <div class="bg-gradient-to-tr from-teal-500 to-cyan-500 text-slate-950 p-2.5 rounded-xl shadow-lg shadow-teal-500/20">
                        <i class="fa-solid fa-microchip text-xl font-bold"></i>
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <h1 class="font-bold text-xl text-white tracking-tight leading-none">Electro<span class="text-teal-400">Hub</span></h1>
                            <span class="bg-teal-500/10 text-teal-400 text-[10px] font-mono border border-teal-500/30 px-1.5 py-0.5 rounded">v2.0</span>
                        </div>
                        <p class="text-xs text-slate-400 mt-0.5">Electronics & Embedded Systems Services</p>
                    </div>
                </div>

                <!-- Currency Switcher & Add Product Action -->
                <div class="flex items-center gap-3">
                    <div class="flex items-center bg-slate-800 p-1 rounded-xl border border-slate-700/80 text-xs font-semibold">
                        <button id="currUsdBtn" onclick="setCurrency('USD')" class="px-2.5 py-1 rounded-lg text-teal-400 bg-slate-700 shadow transition">USD ($)</button>
                        <button id="currRwfBtn" onclick="setCurrency('RWF')" class="px-2.5 py-1 rounded-lg text-slate-400 hover:text-slate-200 transition">RWF</button>
                    </div>

                    <button id="openAddModalBtn" class="inline-flex items-center gap-2 bg-gradient-to-r from-teal-500 to-cyan-500 hover:from-teal-600 hover:to-cyan-600 text-slate-950 font-semibold px-4 py-2.5 rounded-xl transition duration-150 shadow-lg shadow-teal-500/10 active:scale-95 text-sm">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span class="hidden sm:inline">Add Component</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        
        <!-- Search and Filter Controls -->
        <section class="mb-6 space-y-4">
            <div class="flex flex-col md:flex-row gap-3 items-stretch md:items-center justify-between bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-xl">
                <!-- Search Input -->
                <div class="relative flex-1">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                    <input type="text" id="searchInput" placeholder="Search ESP32, SIM900A, Sensors, Specs..." 
                           class="w-full pl-10 pr-10 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:border-teal-500 focus:outline-none transition text-sm text-slate-100 placeholder-slate-500">
                    <button id="clearSearchBtn" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-slate-500 hover:text-slate-300">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <!-- Sort & Availability Dropdowns -->
                <div class="flex gap-2">
                    <select id="stockFilter" class="py-2.5 px-3 bg-slate-950 border border-slate-800 rounded-xl focus:border-teal-500 focus:outline-none text-xs text-slate-200 transition">
                        <option value="all">All Availability</option>
                        <option value="in-stock">In Stock</option>
                        <option value="low-stock">Low Stock</option>
                        <option value="out-of-stock">Out of Stock</option>
                    </select>

                    <select id="sortFilter" class="py-2.5 px-3 bg-slate-950 border border-slate-800 rounded-xl focus:border-teal-500 focus:outline-none text-xs text-slate-200 transition">
                        <option value="newest">Sort: Newest</option>
                        <option value="price-asc">Price: Low to High</option>
                        <option value="price-desc">Price: High to Low</option>
                        <option value="title-asc">Name: A to Z</option>
                    </select>
                </div>
            </div>

            <!-- Main Categories Filter Chips -->
            <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none" id="categoryChips">
                <!-- Dynamically generated category tabs -->
            </div>
        </section>

        <!-- Product Count & Stats -->
        <div class="flex justify-between items-center mb-4 px-1 text-xs text-slate-400 font-mono">
            <span id="productCountText">Showing 0 products</span>
            <button id="resetFiltersBtn" onclick="resetAllFilters()" class="hidden text-teal-400 hover:underline">Reset filters</button>
        </div>

        <!-- Catalog Product Grid -->
        <section id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Dynamically populated cards -->
        </section>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16 bg-slate-900/50 rounded-2xl border border-dashed border-slate-800 px-4">
            <div class="w-16 h-16 bg-slate-800 text-teal-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl border border-slate-700">
                <i class="fa-solid fa-microchip"></i>
            </div>
            <h3 class="text-lg font-semibold text-white mb-1">No items found</h3>
            <p class="text-sm text-slate-400 max-w-md mx-auto mb-6" id="emptyStateMessage">We couldn't find any electronics matching your criteria.</p>
            <button onclick="openAddModal()" class="inline-flex items-center gap-2 bg-teal-500 hover:bg-teal-600 text-slate-950 font-semibold px-4 py-2 rounded-xl transition text-sm">
                <i class="fa-solid fa-plus"></i> Add New Product
            </button>
        </div>
    </main>

    <!-- Modal: Add / Edit Electronics Product -->
    <div id="productModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden transition-opacity duration-200 opacity-0">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl w-full max-w-xl max-h-[92vh] flex flex-col overflow-hidden transform transition-all scale-95 duration-200">
            
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/90">
                <div class="flex items-center gap-2.5">
                    <i class="fa-solid fa-plug-circle-plus text-teal-400"></i>
                    <h3 id="modalTitle" class="text-lg font-bold text-white">Add Electronics Product</h3>
                </div>
                <button id="closeModalBtn" class="text-slate-400 hover:text-white p-1 rounded-lg transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Modal Form -->
            <form id="productForm" class="p-6 overflow-y-auto space-y-4 flex-1">
                <input type="hidden" id="productId">

                <!-- Title -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5" for="formTitle">Component / Service Name *</label>
                    <input type="text" id="formTitle" required placeholder="e.g. ESP32 NodeMCU Wi-Fi + Bluetooth Board" 
                           class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:border-teal-500 focus:outline-none text-sm text-slate-100 transition">
                </div>

                <!-- Main Category & Stock Row -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5" for="formCategory">Category *</label>
                        <select id="formCategory" required class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:border-teal-500 focus:outline-none text-sm text-slate-100 transition">
                            <option value="Development Boards">Development Boards</option>
                            <option value="Communication Modules">Communication Modules</option>
                            <option value="Electronics Kits">Electronics Kits</option>
                            <option value="Sensors & Actuators">Sensors & Actuators</option>
                            <option value="Power & Batteries">Power & Batteries</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5" for="formStockStatus">Stock Status *</label>
                        <select id="formStockStatus" required class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:border-teal-500 focus:outline-none text-sm text-slate-100 transition">
                            <option value="In Stock">In Stock</option>
                            <option value="Low Stock">Low Stock</option>
                            <option value="Out of Stock">Out of Stock</option>
                        </select>
                    </div>
                </div>

                <!-- Price Field -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5" for="formPrice">Price (USD $) *</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">$</span>
                            <input type="number" id="formPrice" step="0.01" min="0" required placeholder="8.50" 
                                   class="w-full pl-8 pr-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:border-teal-500 focus:outline-none text-sm text-slate-100 transition">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5" for="formStockQty">Quantity Available</label>
                        <input type="number" id="formStockQty" min="0" placeholder="e.g. 50" 
                               class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:border-teal-500 focus:outline-none text-sm text-slate-100 transition">
                    </div>
                </div>

                <!-- Tech Specs -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5" for="formSpecs">Technical Specifications (Key-value / Highlights)</label>
                    <input type="text" id="formSpecs" placeholder="e.g. Dual-core 240MHz, 520KB SRAM, 802.11 b/g/n Wi-Fi" 
                           class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:border-teal-500 focus:outline-none text-sm font-mono text-teal-300 transition">
                </div>

                <!-- Image Source Switcher -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Product Image *</label>
                    
                    <div class="flex gap-4 mb-3 text-xs">
                        <label class="inline-flex items-center cursor-pointer">
                            <input type="radio" name="imageSource" value="url" checked class="text-teal-500 focus:ring-teal-500">
                            <span class="ml-2 text-slate-300">Image URL</span>
                        </label>
                        <label class="inline-flex items-center cursor-pointer">
                            <input type="radio" name="imageSource" value="file" class="text-teal-500 focus:ring-teal-500">
                            <span class="ml-2 text-slate-300">Upload Image File</span>
                        </label>
                    </div>

                    <div id="imageUrlContainer">
                        <input type="url" id="formImageUrl" placeholder="https://images.unsplash.com/..." 
                               class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:border-teal-500 focus:outline-none text-sm text-slate-100 transition">
                    </div>

                    <div id="imageFileContainer" class="hidden">
                        <input type="file" id="formImageFile" accept="image/*" 
                               class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-teal-500/10 file:text-teal-400 hover:file:bg-teal-500/20 cursor-pointer">
                    </div>

                    <div id="imagePreviewContainer" class="mt-3 relative hidden rounded-xl overflow-hidden border border-slate-800 bg-slate-950 h-32 flex items-center justify-center">
                        <img id="imagePreview" src="" alt="Preview" class="max-h-full max-w-full object-contain">
                    </div>
                </div>

                <!-- Description Field -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5" for="formDescription">Description & Pinout / Usage Info *</label>
                    <textarea id="formDescription" rows="3" required placeholder="Detailed description of features, operating voltage, pin layout, applications..." 
                              class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:border-teal-500 focus:outline-none text-sm text-slate-100 transition resize-none"></textarea>
                </div>

                <!-- Action Buttons -->
                <div class="pt-4 border-t border-slate-800 flex justify-end gap-3">
                    <button type="button" id="cancelModalBtn" class="px-4 py-2 border border-slate-700 text-slate-300 font-medium rounded-xl hover:bg-slate-800 transition text-xs">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-gradient-to-r from-teal-500 to-cyan-500 hover:from-teal-600 hover:to-cyan-600 text-slate-950 font-bold rounded-xl transition text-xs shadow-md shadow-teal-500/20">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: View Product Details -->
    <div id="detailModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden transition-opacity duration-200 opacity-0">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[92vh] flex flex-col overflow-hidden transform transition-all scale-95 duration-200">
            <div class="relative bg-slate-950 h-64 sm:h-72 flex items-center justify-center overflow-hidden border-b border-slate-800">
                <img id="detailImage" src="" alt="Product Detail" class="w-full h-full object-contain p-4">
                <button id="closeDetailModalBtn" class="absolute top-4 right-4 bg-slate-900/80 hover:bg-slate-800 text-slate-300 p-2 rounded-full border border-slate-700 backdrop-blur-sm transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
                <span id="detailCategory" class="absolute bottom-4 left-4 bg-slate-900/90 text-teal-400 border border-teal-500/30 text-xs font-mono px-3 py-1 rounded-lg backdrop-blur-sm"></span>
            </div>
            
            <div class="p-6 overflow-y-auto space-y-4">
                <div class="flex justify-between items-start gap-4">
                    <div>
                        <h2 id="detailTitle" class="text-xl font-bold text-white leading-tight"></h2>
                        <span id="detailStockBadge" class="inline-block mt-2 text-[10px] font-mono px-2 py-0.5 rounded border"></span>
                    </div>
                    <div class="text-right">
                        <div id="detailPrice" class="text-2xl font-bold text-teal-400 whitespace-nowrap"></div>
                        <div id="detailPriceConverted" class="text-xs font-mono text-slate-400"></div>
                    </div>
                </div>

                <!-- Technical Specs Box -->
                <div id="detailSpecsBox" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs font-mono text-cyan-300 space-y-1">
                    <span class="text-slate-400 text-[10px] uppercase font-sans tracking-wider block mb-1">Technical Specs:</span>
                    <p id="detailSpecsText"></p>
                </div>

                <div class="border-t border-slate-800 pt-3">
                    <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Description & Usage</h4>
                    <p id="detailDescription" class="text-slate-300 text-sm leading-relaxed whitespace-pre-line"></p>
                </div>
            </div>

            <div class="px-6 py-4 bg-slate-950 border-t border-slate-800 flex justify-between items-center">
                <div class="flex gap-2">
                    <button id="detailEditBtn" class="px-3.5 py-2 border border-slate-700 text-slate-300 hover:bg-slate-800 rounded-xl text-xs font-medium transition flex items-center gap-1.5">
                        <i class="fa-solid fa-pen-to-square"></i> Edit
                    </button>
                    <button id="detailDeleteBtn" class="px-3.5 py-2 bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500/20 rounded-xl text-xs font-medium transition flex items-center gap-1.5">
                        <i class="fa-solid fa-trash-can"></i> Delete
                    </button>
                </div>
                <button id="closeDetailFooterBtn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-medium transition">Close</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-3 bg-slate-900 border border-slate-800 text-white px-4 py-3 rounded-xl shadow-2xl pointer-events-none">
        <i id="toastIcon" class="fa-solid fa-circle-check text-teal-400 text-lg"></i>
        <span id="toastMessage" class="text-xs font-medium">Notification message</span>
    </div>

    <!-- Application Script -->
    <script>
        // Exchange Rate constant (1 USD = ~1380 RWF)
        const USD_TO_RWF = 1380;
        let currentCurrency = 'USD';

        // Initial Sample Products tailored for Electronics Services
        const DEFAULT_ELECTRONICS = [
            {
                id: 'elec_1',
                title: 'ESP32 NodeMCU Wi-Fi + Bluetooth Dev Board',
                category: 'Development Boards',
                price: 7.50,
                stockStatus: 'In Stock',
                stockQty: 45,
                specs: 'Dual-Core 240MHz, 520KB SRAM, Wi-Fi 802.11 b/g/n, BLE 4.2',
                image: 'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=800&q=80',
                description: 'High-performance microcontroller board ideal for IoT projects, smart home automation, and wireless data streaming. Features dual-mode Bluetooth and built-in antenna.',
                createdAt: Date.now() - 5000000
            },
            {
                id: 'elec_2',

                image: 'https://images.unsplash.com/photo-1555680202-c86f0e12f086?auto=format&fit=crop&w=800&q=80',
                description: 'The standard microcontroller board for beginners and prototyping. Compatible with hundreds of shields, sensors, and the Arduino IDE ecosystem.',
                createdAt: Date.now() - 4000000
            },
            {
                id: 'elec_3',
                title: 'SIM900A GSM/GPRS Quad-Band Module',
                category: 'Communication Modules',
                price: 14.50,
                stockStatus: 'Low Stock',
                stockQty: 6,
                specs: 'Quad-Band 850/900/1800/1900MHz, AT Commands, UART Interface',
                image: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=800&q=80',
                description: 'Compact GSM module for adding SMS sending, voice calls, and GPRS internet data transmission to your embedded microcontrollers.',
                createdAt: Date.now() - 3000000
            },
            {
                id: 'elec_4',
                title: 'SIM800C GSM / GPRS Module with Antenna',
                category: 'Communication Modules',
                price: 11.20,
                stockStatus: 'In Stock',
                stockQty: 20,
                specs: 'Bluetooth 3.0 + EDR, Quad-Band, Ultra-compact 17.6 x 15.7mm',
                image: 'https://images.unsplash.com/photo-1608564697071-ddf911d81370?auto=format&fit=crop&w=800&q=80',
                description: 'Low power consumption cellular module. Excellent for telemetry, vehicle tracking system (GPS integration), and remote SMS alert triggers.',

            },
            {
                id: 'elec_5',
                title: 'Complete 37-in-1 Sensor & IoT Starter Kit',
                category: 'Electronics Kits',
                price: 29.99,
                stockStatus: 'In Stock',
                stockQty: 15,
                specs: 'Includes Ultrasonic, DHT11, Relays, Flame, Infrared, OLED Display',
                image: 'https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=800&q=80',
                description: 'All-in-one electronic module kit for students, engineers, and hobbyists. Contains sensors for temperature, obstacle detection, light sensing, and motion detection.',
                createdAt: Date.now() - 2000000
            },
            {
                id: 'elec_6',
                title: 'HC-05 Wireless Bluetooth Transceiver Module',
                category: 'Communication Modules',
                price: 4.80,
                stockStatus: 'In Stock',
                stockQty: 50,
                specs: 'Bluetooth V2.0+EDR, 3.3V/5V Logic, Baud rate up to 115200bps',
                image: 'https://images.unsplash.com/photo-1563770660941-20978e770fa3?auto=format&fit=crop&w=800&q=80',
                description: 'Easy-to-use Bluetooth serial module designed for transparent wireless serial connection setup between microcontrollers and smartphones.',
                createdAt: Date.now() - 1000000
            }
        ];

        // State Variables
        let products = [];
        let activeCategory = 'All';
        let activeDetailProductId = null;

        const CATEGORIES = [
            'All',
            'Development Boards',
            'Communication Modules',
            'Electronics Kits',
            'Sensors & Actuators',
            'Power & Batteries'
        ];

        // DOM Elements
        const productGrid = document.getElementById('productGrid');
        const emptyState = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const sortFilter = document.getElementById('sortFilter');
        const stockFilter = document.getElementById('stockFilter');
        const categoryChips = document.getElementById('categoryChips');
        const productCountText = document.getElementById('productCountText');
        const resetFiltersBtn = document.getElementById('resetFiltersBtn');

        // Modal Elements
        const productModal = document.getElementById('productModal');
        const modalTitle = document.getElementById('modalTitle');
        const productForm = document.getElementById('productForm');
        const openAddModalBtn = document.getElementById('openAddModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');

        // Form Fields
        const productIdInput = document.getElementById('productId');
        const formTitle = document.getElementById('formTitle');
        const formCategory = document.getElementById('formCategory');
        const formStockStatus = document.getElementById('formStockStatus');
        const formPrice = document.getElementById('formPrice');
        const formStockQty = document.getElementById('formStockQty');
        const formSpecs = document.getElementById('formSpecs');
        const formDescription = document.getElementById('formDescription');
        const formImageUrl = document.getElementById('formImageUrl');
        const formImageFile = document.getElementById('formImageFile');
        const imageUrlContainer = document.getElementById('imageUrlContainer');
        const imageFileContainer = document.getElementById('imageFileContainer');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const imagePreview = document.getElementById('imagePreview');

        // Detail Modal Elements
        const detailModal = document.getElementById('detailModal');
        const detailImage = document.getElementById('detailImage');
        const detailTitle = document.getElementById('detailTitle');
        const detailPrice = document.getElementById('detailPrice');
        const detailPriceConverted = document.getElementById('detailPriceConverted');
        const detailStockBadge = document.getElementById('detailStockBadge');
        const detailCategory = document.getElementById('detailCategory');
        const detailSpecsText = document.getElementById('detailSpecsText');
        const detailSpecsBox = document.getElementById('detailSpecsBox');
        const detailDescription = document.getElementById('detailDescription');

        // Toast Elements
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        const toastIcon = document.getElementById('toastIcon');

        // Initialize App Data
        function initData() {
            const stored = localStorage.getItem('electrohub_products');
            if (stored) {
                try {
                    products = JSON.parse(stored);
                } catch (e) {
                    products = DEFAULT_ELECTRONICS;
                }
            } else {
                products = DEFAULT_ELECTRONICS;
                saveToLocalStorage();
            }
            renderCategoryChips();
            renderApp();
        }

        function saveToLocalStorage() {
            localStorage.setItem('electrohub_products', JSON.stringify(products));
        }

        // Currency Switcher
        function setCurrency(curr) {
            currentCurrency = curr;
            document.getElementById('currUsdBtn').className = curr === 'USD' 
                ? 'px-2.5 py-1 rounded-lg text-teal-400 bg-slate-700 shadow transition' 
                : 'px-2.5 py-1 rounded-lg text-slate-400 hover:text-slate-200 transition';
            
            document.getElementById('currRwfBtn').className = curr === 'RWF' 
                ? 'px-2.5 py-1 rounded-lg text-teal-400 bg-slate-700 shadow transition' 
                : 'px-2.5 py-1 rounded-lg text-slate-400 hover:text-slate-200 transition';
            
            renderApp();
            if (activeDetailProductId && !detailModal.classList.contains('hidden')) {
                openDetailModal(activeDetailProductId);
            }
        }

        function formatPrice(valInUsd) {
            if (currentCurrency === 'RWF') {
                const rwfVal = Math.round(valInUsd * USD_TO_RWF);
                return `${rwfVal.toLocaleString()} RWF`;
            }
            return `$${Number(valInUsd).toFixed(2)}`;
        }

        // Category Chips Setup
        function renderCategoryChips() {
            categoryChips.innerHTML = CATEGORIES.map(cat => {
                const isActive = cat === activeCategory;
                return `
                    <button onclick="setCategoryFilter('${cat}')" 
                            class="px-3 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all border ${
                                isActive 
                                    ? 'bg-teal-500/20 text-teal-300 border-teal-500/50 shadow-md shadow-teal-500/10' 
                                    : 'bg-slate-900 text-slate-400 border-slate-800 hover:border-slate-700 hover:text-slate-200'
                            }">
                        ${cat}
                    </button>
                `;
            }).join('');
        }

        function setCategoryFilter(cat) {
            activeCategory = cat;
            renderCategoryChips();
            renderApp();
        }

        function resetAllFilters() {
            activeCategory = 'All';
            searchInput.value = '';
            sortFilter.value = 'newest';
            stockFilter.value = 'all';
            renderCategoryChips();
            renderApp();
        }

        // Render Catalog Grid
        function renderApp() {
            const query = searchInput.value.toLowerCase().trim();
            const selectedSort = sortFilter.value;
            const selectedStock = stockFilter.value;

            clearSearchBtn.classList.toggle('hidden', query === '');

            // Filter logic
            let filtered = products.filter(p => {
                const matchesCategory = activeCategory === 'All' || p.category === activeCategory;
                const matchesQuery = p.title.toLowerCase().includes(query) || 
                                     p.description.toLowerCase().includes(query) ||
                                     (p.specs && p.specs.toLowerCase().includes(query));
                
                let matchesStock = true;
                if (selectedStock === 'in-stock') matchesStock = p.stockStatus === 'In Stock';
                if (selectedStock === 'low-stock') matchesStock = p.stockStatus === 'Low Stock';
                if (selectedStock === 'out-of-stock') matchesStock = p.stockStatus === 'Out of Stock';

                return matchesCategory && matchesQuery && matchesStock;
            });

            // Sort logic
            filtered.sort((a, b) => {
                if (selectedSort === 'newest') return (b.createdAt || 0) - (a.createdAt || 0);
                if (selectedSort === 'price-asc') return a.price - b.price;
                if (selectedSort === 'price-desc') return b.price - a.price;
                if (selectedSort === 'title-asc') return a.title.localeCompare(b.title);
                return 0;
            });

            const isFiltered = activeCategory !== 'All' || query !== '' || selectedStock !== 'all';
            resetFiltersBtn.classList.toggle('hidden', !isFiltered);

            productCountText.textContent = `Showing ${filtered.length} of ${products.length} components`;

            if (filtered.length === 0) {
                productGrid.innerHTML = '';
                productGrid.classList.add('hidden');
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                productGrid.classList.remove('hidden');
                renderGrid(filtered);
            }
        }

        function renderGrid(items) {
            productGrid.innerHTML = items.map(product => {
                let stockClass = 'bg-teal-500/10 text-teal-400 border-teal-500/20';
                if (product.stockStatus === 'Low Stock') stockClass = 'bg-amber-500/10 text-amber-400 border-amber-500/20';
                if (product.stockStatus === 'Out of Stock') stockClass = 'bg-red-500/10 text-red-400 border-red-500/20';

                return `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg hover:border-slate-700 transition duration-200 flex flex-col group">
                        <!-- Image Container -->
                        <div class="relative bg-slate-950 aspect-video sm:aspect-square p-4 flex items-center justify-center cursor-pointer border-b border-slate-800/80" onclick="openDetailModal('${product.id}')">
                            <img src="${escapeHtml(product.image)}" 
                                 alt="${escapeHtml(product.title)}" 
                                 class="max-h-full max-w-full object-contain group-hover:scale-105 transition duration-300"
                                 onerror="this.onerror=null; this.src='https://placehold.co/600x600/0f172a/38bdf8?text=Circuit+Component';">
                            
                            <span class="absolute top-3 left-3 bg-slate-900/90 text-teal-400 text-[10px] font-mono border border-teal-500/30 px-2 py-0.5 rounded-md backdrop-blur-sm">
                                ${escapeHtml(product.category)}
                            </span>

                            <span class="absolute top-3 right-3 text-[10px] font-mono px-2 py-0.5 rounded-md border ${stockClass}">
                                ${product.stockStatus}
                            </span>
                        </div>

                        <!-- Card Body -->
                        <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                            <div>
                                <h3 onclick="openDetailModal('${product.id}')" class="font-bold text-white text-sm line-clamp-1 cursor-pointer hover:text-teal-400 transition">
                                    ${escapeHtml(product.title)}
                                </h3>

                                <div class="text-teal-400 font-bold text-base mt-1">
                                    ${formatPrice(product.price)}
                                </div>

                                ${product.specs ? `
                                    <p class="text-[11px] font-mono text-slate-400 mt-2 line-clamp-1 bg-slate-950 p-1.5 rounded border border-slate-800">
                                        ${escapeHtml(product.specs)}
                                    </p>
                                ` : ''}

                                <p class="text-slate-400 text-xs line-clamp-2 mt-2 leading-relaxed">
                                    ${escapeHtml(product.description)}
                                </p>
                            </div>

                            <!-- Footer Actions -->
                            <div class="pt-3 border-t border-slate-800 flex items-center justify-between text-xs">
                                <button onclick="openDetailModal('${product.id}')" class="text-teal-400 hover:text-teal-300 font-medium inline-flex items-center gap-1 text-xs">
                                    View Specs <i class="fa-solid fa-chevron-right text-[10px]"></i>
                                </button>

                                <div class="flex items-center gap-1">
                                    <button onclick="openEditModal('${product.id}')" title="Edit item" class="p-1.5 text-slate-400 hover:text-teal-400 hover:bg-slate-800 rounded-lg transition">
                                        <i class="fa-solid fa-pen-to-square"></i>
                                    </button>
                                    <button onclick="deleteProduct('${product.id}')" title="Delete item" class="p-1.5 text-slate-400 hover:text-red-400 hover:bg-slate-800 rounded-lg transition">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Image Selection Radio Logic
        document.querySelectorAll('input[name="imageSource"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'url') {
                    imageUrlContainer.classList.remove('hidden');
                    imageFileContainer.classList.add('hidden');
                    formImageUrl.required = true;
                    formImageFile.required = false;
                    updatePreviewFromUrl();
                } else {
                    imageUrlContainer.classList.add('hidden');
                    imageFileContainer.classList.remove('hidden');
                    formImageUrl.required = false;
                    formImageFile.required = true;
                    updatePreviewFromFile();
                }
            });
        });

        function updatePreviewFromUrl() {
            const url = formImageUrl.value.trim();
            if (url) {
                imagePreview.src = url;
                imagePreviewContainer.classList.remove('hidden');
            } else {
                imagePreviewContainer.classList.add('hidden');
            }
        }

        function updatePreviewFromFile() {
            const file = formImageFile.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    imagePreview.src = e.target.result;
                    imagePreviewContainer.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            } else {
                imagePreviewContainer.classList.add('hidden');
            }
        }

        formImageUrl.addEventListener('input', updatePreviewFromUrl);
        formImageFile.addEventListener('change', updatePreviewFromFile);

        // Modal Handlers
        function openAddModal() {
            productForm.reset();
            productIdInput.value = '';
            modalTitle.textContent = 'Add Electronics Component';
            document.querySelector('input[name="imageSource"][value="url"]').checked = true;
            imageUrlContainer.classList.remove('hidden');
            imageFileContainer.classList.add('hidden');
            imagePreviewContainer.classList.add('hidden');
            
            showModal(productModal);
        }

        function openEditModal(id) {
            const prod = products.find(p => p.id === id);
            if (!prod) return;

            if (!detailModal.classList.contains('hidden')) {
                hideModal(detailModal);
            }

            productIdInput.value = prod.id;
            modalTitle.textContent = 'Edit Electronics Product';
            formTitle.value = prod.title;
            formCategory.value = prod.category;
            formStockStatus.value = prod.stockStatus || 'In Stock';
            formPrice.value = prod.price;
            formStockQty.value = prod.stockQty || '';
            formSpecs.value = prod.specs || '';
            formDescription.value = prod.description;

            document.querySelector('input[name="imageSource"][value="url"]').checked = true;
            imageUrlContainer.classList.remove('hidden');
            imageFileContainer.classList.add('hidden');
            formImageUrl.value = prod.image;
            updatePreviewFromUrl();

            showModal(productModal);
        }

        function openDetailModal(id) {
            const prod = products.find(p => p.id === id);
            if (!prod) return;

            activeDetailProductId = id;
            detailTitle.textContent = prod.title;
            detailCategory.textContent = prod.category;
            detailPrice.textContent = formatPrice(prod.price);

            if (currentCurrency === 'USD') {
                detailPriceConverted.textContent = `(~ ${(Math.round(prod.price * USD_TO_RWF)).toLocaleString()} RWF)`;
            } else {
                detailPriceConverted.textContent = `($${Number(prod.price).toFixed(2)} USD)`;
            }

            // Stock Badge Styling
            detailStockBadge.textContent = prod.stockStatus || 'In Stock';
            if (prod.stockStatus === 'Low Stock') {
                detailStockBadge.className = 'inline-block mt-2 text-[10px] font-mono px-2 py-0.5 rounded border bg-amber-500/10 text-amber-400 border-amber-500/20';
            } else if (prod.stockStatus === 'Out of Stock') {
                detailStockBadge.className = 'inline-block mt-2 text-[10px] font-mono px-2 py-0.5 rounded border bg-red-500/10 text-red-400 border-red-500/20';
            } else {
                detailStockBadge.className = 'inline-block mt-2 text-[10px] font-mono px-2 py-0.5 rounded border bg-teal-500/10 text-teal-400 border-teal-500/20';
            }

            if (prod.specs) {
                detailSpecsBox.classList.remove('hidden');
                detailSpecsText.textContent = prod.specs;
            } else {
                detailSpecsBox.classList.add('hidden');
            }

            detailDescription.textContent = prod.description;
            detailImage.src = prod.image;
            detailImage.onerror = () => {
                detailImage.src = 'https://placehold.co/600x600/0f172a/38bdf8?text=Circuit+Component';
            };

            showModal(detailModal);
        }

        function showModal(modalEl) {
            modalEl.classList.remove('hidden');
            setTimeout(() => {
                modalEl.classList.remove('opacity-0');
                const inner = modalEl.querySelector('div');
                if (inner) inner.classList.remove('scale-95');
            }, 10);
        }

        function hideModal(modalEl) {
            const inner = modalEl.querySelector('div');
            if (inner) inner.classList.add('scale-95');
            modalEl.classList.add('opacity-0');
            setTimeout(() => {
                modalEl.classList.add('hidden');
            }, 200);
        }

        // Submit Form Handler
        productForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const id = productIdInput.value;
            const title = formTitle.value.trim();
            const category = formCategory.value;
            const stockStatus = formStockStatus.value;
            const price = parseFloat(formPrice.value);
            const stockQty = formStockQty.value ? parseInt(formStockQty.value) : 0;
            const specs = formSpecs.value.trim();
            const description = formDescription.value.trim();
            const isUrlSource = document.querySelector('input[name="imageSource"]:checked').value === 'url';

            const processSave = (imageUrl) => {
                if (id) {
                    const index = products.findIndex(p => p.id === id);
                    if (index !== -1) {
                        products[index] = {
                            ...products[index],
                            title,
                            category,
                            stockStatus,
                            price,
                            stockQty,
                            specs,
                            description,
                            image: imageUrl
                        };
                        showToast('Component updated successfully!');
                    }
                } else {
                    const newProd = {
                        id: 'elec_' + Date.now(),
                        title,
                        category,
                        stockStatus,
                        price,
                        stockQty,
                        specs,
                        description,
                        image: imageUrl,
                        createdAt: Date.now()
                    };
                    products.unshift(newProd);
                    showToast('New electronic component published!');
                }

                saveToLocalStorage();
                renderApp();
                hideModal(productModal);
            };

            if (isUrlSource) {
                processSave(formImageUrl.value.trim());
            } else {
                const file = formImageFile.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => processSave(evt.target.result);
                    reader.readAsDataURL(file);
                } else if (id) {
                    const existing = products.find(p => p.id === id);
                    processSave(existing ? existing.image : '');
                }
            }
        });

        // Delete Product
        function deleteProduct(id) {
            const prod = products.find(p => p.id === id);
            if (!prod) return;

            if (confirm(`Are you sure you want to delete "${prod.title}"?`)) {
                products = products.filter(p => p.id !== id);
                saveToLocalStorage();
                renderApp();
                showToast('Product removed from catalog.', 'danger');
                if (!detailModal.classList.contains('hidden')) {
                    hideModal(detailModal);
                }
            }
        }

        // Display Toast
        function showToast(msg, type = 'success') {
            toastMessage.textContent = msg;
            if (type === 'danger') {
                toastIcon.className = 'fa-solid fa-circle-xmark text-red-400 text-lg';
            } else {
                toastIcon.className = 'fa-solid fa-circle-check text-teal-400 text-lg';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Global Event Listeners
        openAddModalBtn.addEventListener('click', openAddModal);
        closeModalBtn.addEventListener('click', () => hideModal(productModal));
        cancelModalBtn.addEventListener('click', () => hideModal(productModal));

        closeDetailModalBtn.addEventListener('click', () => hideModal(detailModal));
        closeDetailFooterBtn.addEventListener('click', () => hideModal(detailModal));

        detailEditBtn.addEventListener('click', () => {
            if (activeDetailProductId) openEditModal(activeDetailProductId);
        });

        detailDeleteBtn.addEventListener('click', () => {
            if (activeDetailProductId) deleteProduct(activeDetailProductId);
        });

        searchInput.addEventListener('input', renderApp);
        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            renderApp();
        });

        sortFilter.addEventListener('change', renderApp);
        stockFilter.addEventListener('change', renderApp);

        [productModal, detailModal].forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) hideModal(modal);
            });
        });

        // Initialize App
        window.onload = initData;
    </script>
</body>
</html>
